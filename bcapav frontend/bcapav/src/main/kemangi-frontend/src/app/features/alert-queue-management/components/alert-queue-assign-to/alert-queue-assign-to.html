<div class="card no-border card-pavo-default-type-ii mb-24">
  <h5 class="mb-24 section-title">Assign To</h5>

  @if(mode!=='DELETE'){
  <button
    type="button"
    class="btn-type-1 btn-assign-to mb-24"
    (click)="open(content)"
  >
    Assign To
  </button>
  }

  <app-table
    [columns]="columns"
    [data]="tableData"
    [pageInfo]="pageInfo"
    [pageParams]="pageQuery"
    [cellTemplates]="{
          no: noTpl,
        }"
    (pageChange)="handlePageChange($event)"
    (sort)="handleSortChange($event.direction, $event.key)"
    [showPageInfo]="true"
    [squared]="true"
  />
</div>

<ng-template #noTpl let-row let-i="index">
  {{ (pageQuery.page - 1) * pageQuery.limit + i + 1 }}
</ng-template>

<ng-template #content let-modal>
  <div class="card no-border modal-assign-to">
    <h5 class="section-title mb-24">Assign To</h5>
    <div class="assign-to-filter-wrapper mb-24">
      <div class="form-item filter-box">
        <label name="filter">Filter</label>

        <div class="ng-select-custom">
          <ng-select
            #filterKeySelect
            [items]="filterKeys"
            bindValue="value"
            bindLabel="label"
            [multiple]="false"
            [hideSelected]="false"
            searchPlaceholder="Choose..."
            placeholder="Select Filter"
            [(ngModel)]="filterKeySelected"
          >
            <ng-template ng-label-tmp let-item="item">
              {{ item.label }}
            </ng-template>
            <ng-template ng-option-tmp let-item="item">
              <div
                class="d-flex w-100 justify-content-between align-items-center"
              >
                <span>{{ item.label }}</span>
                <img
                  [class.d-none]="
                      filterKeySelected !==
                      item.value
                    "
                  src="assets/img/ic-check-black.svg"
                  alt="selected"
                />
              </div>
            </ng-template>
          </ng-select>
          <span class="custom-arrow">
            <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
          </span>
        </div>
      </div>

      <div class="search-assign-to-box">
        <div class="form-item">
          <input
            type="text"
            class="form-control"
            placeholder="Search here"
            [(ngModel)]="filterSearchQuery"
          />
        </div>
        <button type="button" class="search-btn" (click)="handleSearch()">
          <img src="/assets/img/ic-small-magnifier-white.svg" alt="search" />
        </button>
        <button
          type="button"
          class="btn-type-6 btn-light-blue"
          (click)="handleReset()"
        >
          Reset
        </button>
      </div>
    </div>

    <app-user-grid
      [users]="users"
      [selectedUsers]="initialSelectedIds"
      (assignToTableChange)="handleDataFillingTable($event)"
    ></app-user-grid>

    <div class="d-flex justify-content-end">
      <button
        type="button"
        (click)="cancel()"
        class="btn-type-6 btn-light-blue fw-bold"
        style="margin-right: 11px"
      >
        Back
      </button>
      <button
        type="button"
        (click)="save()"
        class="btn-type-6 btn-dark-blue fw-bold"
      >
        Save
      </button>
    </div>
  </div>
</ng-template>
