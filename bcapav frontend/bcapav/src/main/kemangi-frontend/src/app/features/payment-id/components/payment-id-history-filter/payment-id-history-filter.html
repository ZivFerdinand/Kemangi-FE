<div class="d-flex position-relative mb-24">
  <button
    type="button"
    class="btn-type-1 toggle-filter"
    (click)="toggleFilter()"
  >
    <img src="/assets/img/ic-filter-blue.svg" alt="filter" />
    <div class="name">Filter</div>
  </button>

  <form class="card card--filter" [class.d-none]="!showFilter()">
    <div class="filter-inputs">
      <div class="filter-inputs-section">
        <div class="form-item mb-24">
          <label for="requestedDateInput" class="label-medium">
            Request Date
          </label>
          <app-date-range-picker
            [name]="'requestDate'"
            [displayMonths]="1"
            [fromDate]="requestFromDate"
            [toDate]="requestToDate"
            [maxDate]="maxDate"
            (fromDateChange)="onFromDateChange($event)"
            (toDateChange)="onToDateChange($event)"
            [placeholder]="'dd-mmm-yyyy to dd-mmm-yyyy'"
            [outsideDays]="'visible'"
          />
        </div>

        <div class="form-item mb-24">
          <label for="requestedDateInput" class="label-medium">
            Last Action Date
          </label>
          <app-date-range-picker
            [name]="'actionDate'"
            [displayMonths]="1"
            [fromDate]="actionFromDate"
            [toDate]="actionToDate"
            [maxDate]="maxDate"
            (fromDateChange)="onFromDateChange($event)"
            (toDateChange)="onToDateChange($event)"
            [placeholder]="'dd-mmm-yyyy to dd-mmm-yyyy'"
            [outsideDays]="'visible'"
          />
        </div>

        <div class="form-item mb-24">
          <label for="name">Payment ID</label>
          <input
            type="text"
            class="form-control"
            placeholder="Payment ID"
            [value]="filterBy().paymentId"
            (input)="updateFilter('paymentId', $event.target.value)"
          />
        </div>

        <div class="form-item">
          <label for="name">Customer Name</label>
          <input
            type="text"
            class="form-control"
            placeholder="Customer Name"
            [value]="filterBy().customerName"
            (input)="updateFilter('customerName', $event.target.value)"
          />
        </div>
      </div>

      <div class="filter-inputs-section">
        <div class="form-item mb-24">
          <label for="action">Request Type</label>
          <div class="ng-select-custom">
            <ng-select
              #requestTypeSelect
              [items]="requestType"
              bindLabel="name"
              bindValue="id"
              [multiple]="false"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="Request Type"
              (change)="updateFilter('requestType', $event)"
            >
              <ng-template ng-label-tmp let-item="item">
                {{ item.name }}
              </ng-template>
              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.name }}</span>
                  <img
                    [class.d-none]="filterBy().requestType !== item?.id"
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>

        <div class="form-item mb-24">
          <label for="action">Last Action Status</label>
          <div class="ng-select-custom">
            <ng-select
              #actionStatusSelect
              [items]="actionStatusList"
              bindLabel="name"
              bindValue="id"
              [multiple]="false"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="Last Action Status"
              (change)="updateFilter('actionStatus', $event)"
            >
              <ng-template ng-label-tmp let-item="item">
                {{ item.name }}
              </ng-template>
              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.name }}</span>
                  <img
                    [class.d-none]="filterBy().actionStatus !== item?.id"
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>

        <div class="form-item mb-24">
          <label for="cin">CIN</label>
          <input
            type="text"
            class="form-control"
            placeholder="CIN"
            [value]="filterBy().cin"
            (input)="updateFilter('cin', $event.target.value)"
          />
        </div>

        <div class="form-item">
          <label for="action">Bank Name</label>
          <div class="ng-select-custom">
            <ng-select
              #banksSelect
              [items]="bankList"
              bindLabel="name"
              bindValue="id"
              [multiple]="false"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="Bank Name"
              (change)="updateFilter('bankName', $event)"
            >
              <ng-template ng-label-tmp let-item="item">
                {{ item.name }}
              </ng-template>
              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.name }}</span>
                  <img
                    [class.d-none]="filterBy().bankName !== item?.id"
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="filter-actions">
      <button
        type="button"
        class="btn-type-1 btn-light-blue me-3"
        (click)="resetFilter()"
      >
        Reset
      </button>
      <button
        type="button"
        class="btn-type-1 btn-dark-blue"
        (click)="submitFilter()"
      >
        Apply
      </button>
    </div>
  </form>
</div>
