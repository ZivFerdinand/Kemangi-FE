<div class="d-flex position-relative">
  <button
    type="button"
    class="btn-type-1 toggle-filter"
    (click)="toggleFilter()"
  >
    <img src="/assets/img/ic-filter-blue.svg" alt="filter" />
    <div class="name">Filter</div>
  </button>

  <form class="card card--filter" [class.d-none]="!showFilter()">
    <div class="filter-inputs">
      <div class="filter-inputs-section">
        <div class="form-item mb-24">
          <label for="name">Queue Name</label>
          <input
            type="text"
            class="form-control"
            placeholder="Queue Name"
            [value]="filterBy().name"
            (input)="updateFilter('name', $event.target.value)"
          />
        </div>

        <div class="form-item mb-24">
          <label for="assignTo">Assign To</label>
          <div class="ng-select-custom">
            <ng-select
              #assignToSelect
              [items]="assignToUsers"
              [minTermLength]="3"
              bindLabel="userName"
              bindValue="userId"
              [multiple]="true"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="Assign To"
              (change)="updateFilter('assignTo', $event)"
            >
              <ng-template ng-label-tmp let-item="item" let-clear="clear">
                <span class="ng-value-label"> {{ item?.userName }} </span>
                <span
                  class="ng-value-icon right"
                  (click)="clear(item)"
                  aria-hidden="true"
                  ><img src="/assets/img/ic-times-gray.svg" alt="clear"
                /></span>
              </ng-template>

              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.userName }}</span>
                  <img
                    [class.d-none]="
                        !filterBy().assignTo.includes(item.userId)
                      "
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>

        <div class="form-item mb-24">
          <label for="requesterId">Requested By</label>
          <div class="ng-select-custom">
            <ng-select
              #requesterSelect
              [items]="users"
              [minTermLength]="3"
              bindLabel="fullName"
              bindValue="userId"
              [multiple]="true"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="Requested By"
              (change)="updateFilter('requesterId', $event)"
            >
              <ng-template ng-label-tmp let-item="item" let-clear="clear">
                <span class="ng-value-label"> {{ item?.fullName }} </span>
                <span
                  class="ng-value-icon right"
                  (click)="clear(item)"
                  aria-hidden="true"
                  ><img src="/assets/img/ic-times-gray.svg" alt="clear"
                /></span>
              </ng-template>

              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.fullName }}</span>
                  <img
                    [class.d-none]="
                        !filterBy().requesterId.includes(item.userId)
                      "
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>

        <div class="form-item mb-24">
          <label for="approver1Id">Review 1 By</label>

          <div class="ng-select-custom">
            <ng-select
              #approver1Select
              [items]="users"
              [minTermLength]="3"
              bindLabel="fullName"
              bindValue="userId"
              [multiple]="true"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="Review 1 By"
              (change)="updateFilter('approver1Id', $event)"
            >
              <ng-template ng-label-tmp let-item="item" let-clear="clear">
                <span class="ng-value-label">{{ item?.fullName }}</span>
                <span
                  class="ng-value-icon right"
                  (click)="clear(item)"
                  aria-hidden="true"
                  ><img src="/assets/img/ic-times-gray.svg" alt="clear"
                /></span>
              </ng-template>

              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.fullName }}</span>
                  <img
                    [class.d-none]="
                        !filterBy().approver1Id.includes(item.userId)
                      "
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>

        <div class="form-item mb-24">
          <label for="approver2Id">Review 2 By</label>

          <div class="ng-select-custom">
            <ng-select
              #approver2Select
              [items]="users"
              [minTermLength]="3"
              bindLabel="fullName"
              bindValue="userId"
              [multiple]="true"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="Review 2 By"
              (change)="updateFilter('approver2Id', $event)"
            >
              <ng-template ng-label-tmp let-item="item" let-clear="clear">
                <span class="ng-value-label">{{ item?.fullName }}</span>
                <span
                  class="ng-value-icon right"
                  (click)="clear(item)"
                  aria-hidden="true"
                  ><img src="/assets/img/ic-times-gray.svg" alt="clear"
                /></span>
              </ng-template>

              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.fullName }}</span>
                  <img
                    [class.d-none]="
                        !filterBy().approver2Id.includes(item.userId)
                      "
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>
      </div>

      <div class="filter-inputs-section">
        <div class="form-item mb-24">
          <label for="description">Queue Description</label>
          <textarea
            placeholder="Queue Description"
            id="description"
            class="form-control pr-5"
            rows="3"
            [value]="filterBy().description"
            (change)="updateFilter('description', $any($event.target).value)"
          >
          </textarea>
        </div>

        <div class="form-item mb-24">
          <label for="status">On/Off</label>
          <div class="ng-select-custom">
            <ng-select
              #activeStatusSelect
              [items]="activeStatus"
              bindLabel="name"
              bindValue="id"
              [multiple]="false"
              [hideSelected]="false"
              searchPlaceholder="Choose..."
              placeholder="On/Off"
              (change)="updateFilter('activeStatus', $event)"
            >
              <ng-template ng-label-tmp let-item="item">
                {{ item.name }}
              </ng-template>
              <ng-template ng-option-tmp let-item="item">
                <div
                  class="d-flex w-100 justify-content-between align-items-center"
                >
                  <span>{{ item.name }}</span>
                  <img
                    [class.d-none]="filterBy().activeStatus !== item.id"
                    src="assets/img/ic-check-black.svg"
                    alt="selected"
                  />
                </div>
              </ng-template>
            </ng-select>
            <span class="custom-arrow">
              <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
            </span>
          </div>
        </div>

        <div class="form-item mb-24">
          <label for="requestedDateInput" class="label-medium">
            Requested Date
          </label>
          <app-date-range-picker
            [name]="'requestDate'"
            [displayMonths]="1"
            [fromDate]="requestFromDate"
            [toDate]="requestToDate"
            [maxDate]="maxDate"
            (fromDateChange)="onFromDateChange($event)"
            (toDateChange)="onToDateChange($event)"
            [placeholder]="'dd-mmm-yyyy to dd-mmm-yyyy'"
            [outsideDays]="'visible'"
          />
        </div>

        <div class="form-item mb-24">
          <label for="approval1DateInput" class="label-medium">
            Review 1 Date
          </label>
          <app-date-range-picker
            [name]="'approval1Date'"
            [displayMonths]="1"
            [fromDate]="approval1FromDate"
            [toDate]="approval1ToDate"
            [maxDate]="maxDate"
            (fromDateChange)="onFromDateChange($event)"
            (toDateChange)="onToDateChange($event)"
            [placeholder]="'dd-mmm-yyyy to dd-mmm-yyyy'"
            [outsideDays]="'visible'"
          />
        </div>

        <div class="form-item mb-24">
          <label for="approval2DateInput" class="label-medium">
            Review 2 Date
          </label>
          <app-date-range-picker
            [name]="'approval2Date'"
            [displayMonths]="1"
            [fromDate]="approval2FromDate"
            [toDate]="approval2ToDate"
            [maxDate]="maxDate"
            (fromDateChange)="onFromDateChange($event)"
            (toDateChange)="onToDateChange($event)"
            [placeholder]="'dd-mmm-yyyy to dd-mmm-yyyy'"
            [outsideDays]="'visible'"
          />
        </div>
      </div>
    </div>

    <div class="filter-actions">
      <button
        type="button"
        class="btn-type-1 btn-light-blue me-3"
        (click)="resetFilter()"
      >
        Reset
      </button>
      <button
        type="button"
        class="btn-type-1 btn-dark-blue"
        (click)="submitFilter()"
      >
        Apply
      </button>
    </div>
  </form>
</div>
