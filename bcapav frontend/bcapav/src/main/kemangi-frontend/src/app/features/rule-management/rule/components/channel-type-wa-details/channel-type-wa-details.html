@let tC = templateContent; @let aD=autoActionData;

<h5 class="mb-24 action-type-form-title">WA</h5>

<div class="form-item mb-24">
  <label>Template ID</label>

  <div class="channel-type--container">{{tC.template||'-'}}</div>
</div>

<div class="form-item mb-24">
  <label class="disabled">Recipient</label>

  <input
    type="text"
    class="form-control pr-5"
    placeholder="Recipient"
    [value]="tC.recipient"
    disabled
  />
</div>

<div class="form-item mb-24">
  <label class="disabled">Content</label>

  <textarea
    #autoContent
    id="content"
    class="form-control pr-5"
    rows="15"
    placeholder="Content"
    style="height: 288px"
    [value]="tC.waBody"
    disabled
  ></textarea>
</div>

<div class="d-flex justify-content-between align-items-start mb-24">
  <div class="form-item" style="width: 48%">
    <label>Image</label>

    <button
      type="button"
      (click)="handleDownload(tC.waImage)"
      class="rule-btn-upload"
      [disabled]="!tC.waImage"
    >
      View Image
    </button>
  </div>

  <div class="form-item" style="width: 48%">
    <label>Video</label>

    <button
      type="button"
      (click)="handleDownload(tC.waVideo)"
      class="rule-btn-upload"
      [disabled]="!tC.waVideo"
    >
      View Video
    </button>
  </div>
</div>

<div class="d-flex justify-content-between align-items-start mb-24">
  <div class="form-item" style="width: 48%">
    <label>Document</label>

    <button
      type="button"
      (click)="handleDownload(tC.waDocument)"
      class="rule-btn-upload"
      [disabled]="!tC.waDocument"
    >
      View Document
    </button>
  </div>

  <div class="form-item" style="width: 48%">
    <label class="disabled">Button</label>

    <input
      type="text"
      class="form-control pr-5"
      placeholder="Button Link"
      [value]="tC.waButton"
      disabled
    />
  </div>
</div>

<div class="d-flex align-items-center form-group-custom mb-24">
  <img
    [src]="aD.limitFlag?'/assets/img/ic-checkbox-gray-checked.svg':'/assets/img/ic-checkbox-gray-unchecked.svg'"
    alt="has-pipeline"
  />

  <label class="form-check-label" for="limit">Limit</label>
</div>

@if(aD.limitFlag){
<ng-container>
  <div class="d-flex justify-content-between align-items-start mb-24">
    <div class="form-item" style="width: 48%">
      <label>Key</label>

      <div class="channel-type--container">{{aD.key||''}}</div>
    </div>

    <div class="form-item" style="width: 48%">
      <label>Threshold</label>

      <div class="channel-type--container">{{aD.threshold||''}}</div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-start">
    <div class="form-item" style="width: 48%">
      <label>Period</label>

      <div class="channel-type--container">{{aD.period||''}}</div>
    </div>

    <div class="form-item" style="width: 48%">
      <label>Unit</label>

      <div class="channel-type--container">{{aD.unit||''}}</div>
    </div>
  </div>
</ng-container>
}
