<section class="card no-border card-pavo-default-type-ii mb-24">
  <div class="mb-24 fw-semibold fs-7-5">Detail Value</div>

  <input type="file" #fileInput hidden (change)="onFileSelected($event)" />

  <div
    class="d-flex justify-content-between align-items-end flex-wrap"
    style="margin-bottom: 8px"
  >
    <div class="d-flex align-items-end">
      <div class="d-flex align-items-end">
        <div class="form-item me-3">
          <label for="table_value">Table Value</label>
          <input
            type="text"
            class="form-control pr-5"
            placeholder="Search here"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
            (keyup.enter)="findData()"
          />
        </div>

        <button type="button" class="search-btn" (click)="findData()">
          <img src="/assets/img/ic-find.svg" alt="find" />
        </button>
      </div>
      <div class="ms-3 d-flex">
        <button
          type="button"
          class="btn-type-3 btn-white-outlined fw-bold"
          (click)="downloadFile()"
        >
          Download Value
        </button>
      </div>
    </div>

    @if(type==='2'){
    <div class="mt-2">
      <app-custom-tab
        [tabs]="tabs"
        [activeTab]="activeTab()"
        (tabChange)="handleTabChange($event)"
        [tabBg]="'#E6F3FF'"
        [tabBtnBg]="'#E6F3FF'"
      ></app-custom-tab>
    </div>

    }
  </div>

  <app-table
    [additionalData]="additionalData()"
    (sort)="toggleSort($event.direction)"
    [columns]="column"
    [data]="pagedValues()"
    [pagination]="false"
    [showPageInfo]="false"
    [showNoData]="true"
    [cellTemplates]="{
          no: noTpl,
          value: valueTpl,
     }"
  />

  <div
    class="d-flex justify-content-between align-items-center"
    style="margin-top: 30px"
  >
    <div class="page-info">
      Showing {{ startIndex() }} to {{ endIndex() }} of {{ totalItems()}}
      entries
    </div>
    <div class="d-flex align-items-center">
      <ngb-pagination
        class="table-pagination"
        [page]="page()"
        [pageSize]="pageSize()"
        [collectionSize]="totalItems()"
        [maxSize]="5"
        [rotate]="true"
        [ellipses]="false"
        [boundaryLinks]="true"
        (pageChange)="onPageChange($event)"
      >
        <ng-template ngbPaginationFirst>
          <img
            src="assets/img/ic-chevron-double-left.svg"
            alt="first"
            width="16"
            height="16"
          />
        </ng-template>

        <ng-template ngbPaginationPrevious>
          <img
            src="assets/img/ic-chevron-left.svg"
            alt="prev"
            width="16"
            height="16"
          />
        </ng-template>

        <ng-template ngbPaginationNext>
          <img
            src="assets/img/ic-chevron-right.svg"
            alt="next"
            width="16"
            height="16"
          />
        </ng-template>

        <ng-template ngbPaginationLast>
          <img
            src="assets/img/ic-chevron-double-right.svg"
            alt="last"
            width="16"
            height="16"
          />
        </ng-template>
      </ngb-pagination>

  </div>
</section>

<ng-template #noTpl let-row let-i="index">
  {{ (page() - 1) * pageSize() + i + 1 }}
</ng-template>

<ng-template #valueTpl let-row let-i="index"
  ><div class="truncate" [class.highlight]="additionalData().includes(row)">
    {{ row }}
  </div>
</ng-template>
