@let tC = templateContent; @let aD=autoActionData;
<div class="form-item mb-24">
  <label>Template</label>

  <div class="channel-type--container">{{tC.apiName||''}}</div>
</div>

<div class="form-item mb-24">
  <label class="disabled">Wording</label>

  <textarea
    #autoContent
    id="content"
    class="form-control pr-5"
    rows="15"
    placeholder="Wording"
    style="height: 288px"
    [value]="tC.template"
    disabled
  ></textarea>

  <div
    class="d-flex align-items-center form-group-custom mb-24"
    style="margin-top: 12px"
  >
    <img
      [src]="aD.limitFlag?'/assets/img/ic-checkbox-gray-checked.svg':'/assets/img/ic-checkbox-gray-unchecked.svg'"
      alt="has-pipeline"
    />

    <label class="form-check-label" for="limit">Limit</label>
  </div>
</div>

@if(aD.limitFlag){
<ng-container>
  <div class="d-flex justify-content-between align-items-start mb-24">
    <div class="form-item" style="width: 48%">
      <label>Key</label>

      <div class="channel-type--container">{{aD.key||''}}</div>
    </div>

    <div class="form-item" style="width: 48%">
      <label>Threshold</label>

      <div class="channel-type--container">{{aD.threshold||''}}</div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-start">
    <div class="form-item" style="width: 48%">
      <label>Period</label>

      <div class="channel-type--container">{{aD.period||''}}</div>
    </div>

    <div class="form-item" style="width: 48%">
      <label>Unit</label>

      <div class="channel-type--container">{{aD.unit||''}}</div>
    </div>
  </div>
</ng-container>
}
