@let d = details; @let p = prevDetails;

<div class="card no-border card-pavo-default-type-ii w-100 mb-24">
  <div class="d-flex w-49">
    <div class="d-flex flex-column me-40 w-49">
      <div class="form-item">
        <label for="role_group">Requested By</label>
        <div class="content-detail">{{ d.requesterName || "-" }}</div>
      </div>
    </div>
    <div class="d-flex flex-column w-49">
      <div class="form-item">
        <label for="role_description">Requested Date</label>
        <div class="content-detail">
          {{ details.requestDate === '' ?'-': (details.requestDate |
          date:'dd-MMM-yyyy HH:mm:ss') }}
        </div>
      </div>
    </div>
  </div>
</div>

<div class="w-100 d-flex align-items-start justify-content-between mb-24">
  <div class="card no-border card-pavo-default-type-ii w-49">
    <div class="d-flex align-items-center">
      <div class="edit-approval-title-state">Before</div>
    </div>
  </div>
  <div class="card no-border card-pavo-default-type-ii w-49">
    <div class="d-flex align-items-center">
      <div class="edit-approval-title-state">After</div>
    </div>
  </div>
</div>

<div class="w-100 d-flex align-items-start justify-content-between mb-24">
  <div class="card no-border card-pavo-default-type-ii w-49">
    <div style="margin-bottom: 18px">
      <app-toggle-switch
        [(ngModel)]="p.activeStatus"
        [disabled]="isDisabled"
      ></app-toggle-switch>
    </div>

    <div class="d-flex align-items-start">
      <div class="d-flex flex-column me-40" style="width: 360px">
        <div class="form-item mb-24">
          <label for="fraud_type">Notes</label>
          <div class="content-detail">{{ p.note || "-" }}</div>
        </div>
      </div>
      <div class="d-flex flex-column" style="width: 360px">
        <div class="form-item mb-24">
          <label for="role_name">Description</label>
          <div class="content-detail">{{ p.description || "-" }}</div>
        </div>
      </div>
    </div>
  </div>
  <div class="card no-border card-pavo-default-type-ii w-49">
    <div style="margin-bottom: 18px">
      <app-toggle-switch
        [(ngModel)]="d.activeStatus"
        [disabled]="isDisabled"
      ></app-toggle-switch>
    </div>

    <div class="d-flex align-items-start">
      <div class="d-flex flex-column me-40" style="width: 360px">
        <div class="form-item mb-24">
          <label for="fraud_type">Notes</label>
          <div class="content-detail" [class.after]="d.note!==p.note">
            {{ d.note || "-" }}
          </div>
        </div>
      </div>
      <div class="d-flex flex-column" style="width: 360px">
        <div class="form-item mb-24">
          <label for="description">Description</label>
          <div
            class="content-detail"
            [class.after]="d.description!==p.description"
          >
            {{ d.description || "-" }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="d-flex align-items-center justify-content-end btn-section">
  <button type="button" class="btn-type-1 btn-white-outlined" (click)="back()">
    Back
  </button>
  @if(pageType==='task list'){
  <button type="button" class="btn-type-1 btn-reject ms-3" (click)="reject()">
    Reject
  </button>
  <button type="button" class="btn-type-1 btn-approve ms-3" (click)="approve()">
    Approve
  </button>
  }
</section>
