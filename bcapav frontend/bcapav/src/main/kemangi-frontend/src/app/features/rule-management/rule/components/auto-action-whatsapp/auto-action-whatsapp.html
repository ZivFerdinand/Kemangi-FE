<h5 class="mb-24 action-type-form-title">WA</h5>

<div class="form-item mb-24">
  <label>Template ID</label>

  <div class="ng-select-custom">
    <ng-select
      [items]="dropdownWaTemplate"
      bindLabel="template"
      bindValue="waId"
      [multiple]="false"
      [hideSelected]="false"
      searchPlaceholder="Choose..."
      placeholder="Template ID"
      [(ngModel)]="autoActionData.templateId"
      (change)="updateValue('waTemplateId',$event)"
      #templateIdModel="ngModel"
      required
      [class.is-invalid]="
                  templateIdModel?.invalid &&
                  ( templateIdModel?.dirty ||
                    templateIdModel?.touched)
                "
    >
      <ng-template ng-label-tmp let-item="item">
        {{ item.template }}
      </ng-template>
      <ng-template ng-option-tmp let-item="item">
        <div class="d-flex w-100 justify-content-between align-items-center">
          <span>{{ item.template }}</span>
          <img
            [class.d-none]="
                      autoActionData.templateId !== item.waId
                    "
            src="assets/img/ic-check-black.svg"
            alt="selected"
          />
        </div>
      </ng-template>
    </ng-select>
    <span class="custom-arrow">
      <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
    </span>
  </div>

  @if(templateIdModel.invalid && templateIdModel.touched){
  <div class="invalid-input">Template ID is required</div>
  }
</div>

<div class="form-item mb-24">
  <label class="disabled">Recipient</label>

  <input
    type="text"
    class="form-control pr-5"
    placeholder="Recipient"
    [value]="selectedTemplate.recipient"
    disabled
  />
</div>

<div class="form-item mb-24">
  <label class="disabled">Content</label>

  <textarea
    #autoContent
    id="content"
    class="form-control pr-5"
    rows="15"
    placeholder="Content"
    style="height: 288px"
    [value]="selectedTemplate.waBody"
    disabled
  ></textarea>
</div>

<div class="d-flex justify-content-between align-items-start mb-24">
  <div class="form-item" style="width: 48%">
    <label>Image</label>

    <button
      type="button"
      (click)="handleDownload(selectedTemplate.waImage)"
      class="rule-btn-upload"
      [disabled]="!selectedTemplate.waImage"
    >
      View Image
    </button>
  </div>

  <div class="form-item" style="width: 48%">
    <label>Video</label>

    <button
      type="button"
      (click)="handleDownload(selectedTemplate.waVideo)"
      class="rule-btn-upload"
      [disabled]="!selectedTemplate.waVideo"
    >
      View Video
    </button>
  </div>
</div>

<div class="d-flex justify-content-between align-items-start mb-24">
  <div class="form-item" style="width: 48%">
    <label>Document</label>

    <button
      type="button"
      (click)="handleDownload(selectedTemplate.waDocument)"
      class="rule-btn-upload"
      [disabled]="!selectedTemplate.waDocument"
    >
      View Document
    </button>
  </div>

  <div class="form-item" style="width: 48%">
    <label class="disabled">Button</label>

    <input
      type="text"
      class="form-control pr-5"
      placeholder="Button Link"
      [value]="selectedTemplate.waButton"
      disabled
    />
  </div>
</div>

<div class="form-check d-flex align-items-center form-group-custom mb-24">
  <input
    id="limit"
    class="form-check-input custom-checkbox"
    type="checkbox"
    [checked]="autoActionData.limitFlag"
    (change)="updateValue('limit', $event.target.checked)"
    [disabled]="mode==='VIEW'"
  />

  <label class="form-check-label" for="limit">Limit</label>
</div>

@if(autoActionData.limitFlag){
<ng-container>
  <div class="d-flex justify-content-between align-items-start mb-24">
    <div class="form-item" style="width: 48%">
      <label>Key</label>

      <div class="ng-select-custom">
        <ng-select
          [items]="dropdownParameter"
          bindLabel="parameterValue"
          bindValue="parameterValue"
          [multiple]="false"
          [hideSelected]="false"
          searchPlaceholder="Choose..."
          placeholder="Key"
          [(ngModel)]="autoActionData.key"
          (change)="updateValue('key',$event.parameterValue)"
          [disabled]="mode==='VIEW'"
        >
          <ng-template ng-label-tmp let-item="item">
            {{ item.parameterValue }}
          </ng-template>
          <ng-template ng-option-tmp let-item="item">
            <div
              class="d-flex w-100 justify-content-between align-items-center"
            >
              <span>{{ item.parameterValue}}</span>
              <img
                [class.d-none]="
                      autoActionData.key !== item.parameterValue
                    "
                src="assets/img/ic-check-black.svg"
                alt="selected"
              />
            </div>
          </ng-template>
        </ng-select>
        <span class="custom-arrow">
          <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
        </span>
      </div>
    </div>

    <div class="form-item" style="width: 48%">
      <label>Threshold</label>

      <input
        type="text"
        class="form-control pr-5"
        placeholder="Threshold"
        [value]="autoActionData.threshold"
        (change)="updateValue('threshold',$event.target.value)"
        [disabled]="mode==='VIEW'"
      />
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-start">
    <div class="form-item" style="width: 48%">
      <label>Period</label>

      <input
        type="number"
        class="form-control pr-5"
        placeholder="Period"
        [value]="autoActionData.period"
        (change)="updateValue('period',$event.target.value)"
        [disabled]="mode==='VIEW'"
      />
    </div>

    <div class="form-item" style="width: 48%">
      <label>Unit</label>

      <div class="ng-select-custom">
        <ng-select
          [items]="timeUnits"
          [multiple]="false"
          [hideSelected]="false"
          searchPlaceholder="Choose..."
          placeholder="Unit"
          [(ngModel)]="autoActionData.unit"
          (change)="updateValue('unit',$event)"
          bindValue="value"
          [disabled]="mode==='VIEW'"
        >
          <ng-template ng-label-tmp let-item="item">
            {{ item.label }}
          </ng-template>
          <ng-template ng-option-tmp let-item="item">
            <div
              class="d-flex w-100 justify-content-between align-items-center"
            >
              <span>{{ item.label }}</span>
            </div>
          </ng-template>
        </ng-select>
        <span class="custom-arrow">
          <img src="./assets/img/ic-arrow-down-gray.svg" alt="down" />
        </span>
      </div>
    </div>
  </div>
</ng-container>
}
