<app-content-layout [breadcrumb]="breadcrumb" [title]="pageTitle">
  @if (details().requestType === 'UPDATE') {
  <app-edit-notes-view-approval
    [details]="details()"
    [prevDetails]="prevDetails()"
    [back]="back.bind(this)"
  />
  } @else {
  <app-default-notes-view-approval
    [pageType]="pageType"
    [details]="details()"
    [back]="back.bind(this)"
  />
  }
</app-content-layout>
