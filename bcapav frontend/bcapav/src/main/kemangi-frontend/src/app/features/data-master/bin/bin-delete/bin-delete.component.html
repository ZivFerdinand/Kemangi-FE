<app-content-layout [breadcrumb]="breadcrumb" [title]="pageTitle">
  <form [formGroup]="binForm">
    <section class="card no-border card-pavo-default-type-ii mb-24">
      <div class="mb-24">
        <app-toggle-switch formControlName="activeStatus"></app-toggle-switch>
      </div>

      <div class="d-flex mb-3">
        <div class="d-flex flex-column me-40" style="width: 360px">
          <div class="form-item">
            <label for="binNumber">BIN</label>
            <input
              id="binNumber"
              type="text"
              class="form-control pr-5"
              formControlName="binNumber"
              placeholder="BIN"
            />
          </div>
        </div>
        <div class="d-flex flex-column" style="width: 800px">
          <div class="form-item">
            <label for="binDescription">Description</label>

            <textarea
              #autoDescTA
              id="binDescription"
              class="form-control pr-5"
              formControlName="binDescription"
              rows="1"
              (input)="autogrow(autoDescTA)"
              placeholder="Description"
            ></textarea>
          </div>
        </div>
      </div>
    </section>

    <section class="d-flex align-items-center justify-content-end btn-section">
      <button
        type="button"
        class="btn-type-1 btn-white-outlined me-3"
        (click)="back()"
      >
        Back
      </button>
      <button
        type="button"
        class="btn-type-1 btn-dark-blue"
        (click)="
          f['activeStatus'].value
            ? handleDeleteImmediately()
            : handleDeleteConfirmation()
        "
      >
        Submit
      </button>
    </section>
  </form>
</app-content-layout>
