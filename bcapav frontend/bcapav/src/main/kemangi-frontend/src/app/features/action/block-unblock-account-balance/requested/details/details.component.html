<app-content-layout [breadcrumb]="breadcrumb" [title]="pageTitle">
  <app-block-unblock-account-balance-details
    [data]="details"
    [type]="pageType"
    [tableData]="tableData"
    [pageInfo]="pageInfo"
    [pageQuery]="pageQuery"
    [columns]="columns"
    [showDownloadButton]="true"
    (handlePage)="handlePageChange($event)"
    (handleSort)="handleSortChange($event.order, $event.param)"
    (handledownload)="handleDownload($event)"
    (handleSearch)="handleQuery($event)"
    (handledownloadUnblock)="handleDownloadUnblock()"
  ></app-block-unblock-account-balance-details>

  <section class="d-flex align-items-center justify-content-end btn-section">
    <button
      type="button"
      class="btn-type-1 btn-white-outlined"
      (click)="back()"
    >
      Back
    </button>
  </section>
</app-content-layout>
