<app-content-layout [breadcrumb]="breadcrumb" [title]="pageTitle">
  @if (details().requestType === 'UPDATE') {
  <app-edit-fraud-type-approval
    [pageType]="pageType"
    [details]="details()"
    [prevDetails]="prevDetails()"
    [back]="back.bind(this)"
    [approve]="handleApprove.bind(this)"
    [reject]="handleReject.bind(this)"
  />
  } @else {
  <app-default-fraud-type-approval
    [pageType]="pageType"
    [details]="details()"
    [back]="back.bind(this)"
    [approve]="handleApprove.bind(this)"
    [reject]="handleReject.bind(this)"
  />
  }
</app-content-layout>
