<app-content-layout [breadcrumb]="breadcrumb" [title]="pageTitle">
  <app-alert-details [data]="details" [type]="pageType"></app-alert-details>

  <div class="card no-border card-pavo-default-type-ii mb-24">
    <h5 class="mb-24 title-section">Assign To</h5>
    <div class="pb-3">
      <app-table
        [columns]="columns"
        [data]="tableData"
        [pageInfo]="pageInfo"
        [pageParams]="pageQuery"
        (pageChange)="handlePageChange($event)"
        (sort)="handleSortChange($event.direction, $event.key)"
        [showPageInfo]="true"
        [cellTemplates]="{
          no: noTpl,
        }"
      />
    </div>
  </div>

  <app-rule-model-view [data]="details.details ?? []"></app-rule-model-view>
  <section class="d-flex align-items-center justify-content-end btn-section">
    <button
      type="button"
      class="btn-type-1 btn-white-outlined"
      (click)="back()"
    >
      Back
    </button>
  </section>
</app-content-layout>

<ng-template #noTpl let-row let-i="index">
  {{ (pageQuery.page - 1) * pageQuery.limit + i + 1 }}
</ng-template>
