<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    @for (item of items; track item.label; let last = $last) {
    <li
      class="breadcrumb-item"
      [class.active]="last"
      [attr.aria-current]="last ? 'page' : null"
    >
      @if (!last && item.url) {
      <a [routerLink]="item.url">{{ item.label }}</a>
      } @else { {{ item.label }} }
    </li>
    }
  </ol>
</nav>
