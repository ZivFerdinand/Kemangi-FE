<div id="failedModal">
  <div class="modal-header">
    <div class="content">
      <button
        type="button"
        class="btn-modal-close"
        aria-label="Close"
        (click)="onOkClicked()"
      >
        <img src="/assets/img/ic-times-rounded-red.svg" alt="close" />
      </button>
      <h5 class="title">{{ title || 'Error'}}</h5>
    </div>
  </div>
  <div class="modal-body">
    <p>{{message}}</p>
    <!-- <span id="errorModalDesc">{{message}}</span> -->
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-confirm-yes" (click)="onOkClicked()">
      OK
    </button>
  </div>
</div>
