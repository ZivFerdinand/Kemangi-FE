<div class="uploaded-doc" (click)="viewFileBtn()" style="cursor: pointer;">
  <span class="doc-name">{{originalName.split('.')[0]}}</span>
  <span class="doc-extension">{{extension}}</span>
  @if(showClearBtn){
  <button class="doc-remove" type="button" (click)="removeFile(generatedName)">
    <img src="/assets/img/ic-times-black.svg" alt="clear-all" /></button
  >}
  
</div>
