<div id="confirmationModal">
  @if (title) {
  <div class="modal-header">
    <h4 class="modal-title font-weight-bold">{{ title }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  }

  <div class="modal-body text-center">{{ message }}</div>
  <div class="modal-footer">
    <button type="button" class="btn btn-confirm-no" (click)="decline()">
      {{ btnCancelText }}
    </button>
    <button type="button" class="btn btn-confirm-yes" (click)="accept()">
      {{ btnOkText }}
    </button>
  </div>
</div>
